# The docket's production release (stack/docs/runbooks/release.md). A push to main is
# a merge the owner approved on its release card, which says that this workflow
# deploys. Nothing else deploys main. Disable this workflow to stop production deploys
# (Rollback) without stopping the pull-request checks in deploy.yml. A push that
# changes nothing of the docket does not start it.
#
# The first run deploys the new Worker beside the old one, waits for the operator to
# load the data, checks it on its own address, moves civicobservatory.com to it and
# checks it there, and gives the domain back if anything fails. A run that ended after
# its move and did not succeed, because its runner died for example, is carried on by
# the next run. Every later run redeploys and checks: it never touches the domain, the
# data or the sign-up switch. stack/scripts/production-domain.ts tells them apart by
# GitHub's own records. Where those show neither, or a domain write that may still
# land, a run refuses before it changes anything.
#
# No run reads or writes a firewall rule or a DNS record.
#
# This repository is public, and so is all that a run prints: no step prints an ID, an
# address or the account's workers.dev subdomain (stack/scripts/public-log.ts), and no
# artifact is uploaded. The deploy token comes from the main-only environment
# `production` and reaches only the steps that call Cloudflare. A pull request, of a
# fork or not, cannot start this workflow.
name: Production

on:
  push:
    branches: [main]
    paths:
      - "stack/**"
      - ".github/workflows/production.yml"

permissions: {}

jobs:
  production:
    name: Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jessewalberg/civic-observatory'
    runs-on: ubuntu-24.04
    # The first run waits up to an hour for the load.
    timeout-minutes: 120
    permissions:
      contents: read
      # The inspection reads whether an earlier run already finished the cutover.
      actions: read
    environment:
      name: production
      url: https://civicobservatory.com
    # One run at a time; a newer push waits for the running one.
    concurrency:
      group: civic-docket-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: stack
    env:
      ALCHEMY_STAGE: production
      ALCHEMY_PROFILE: civic-docket-production-ci
      ALCHEMY_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      APP_RELEASE: ${{ github.sha }}
      # scripts/infra.ts deploys production only when this job sets it.
      CIVIC_PRODUCTION_RELEASE: production.yml
    steps:
      # Pinned by commit, and no cache: nothing of a pull request's run comes in.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # vite, tsc and wrangler have Node shebangs that `bun run` honors.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: stack/package.json
          no-cache: true
      # ---- before any credential ----
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Known vulnerabilities in what is served
        run: bun audit --prod --audit-level=high
      - name: Format and lint
        run: bun run check
      - name: Build and typecheck (local bindings)
        run: bun run build
      - name: Chromium for the checks
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: The docket and its loader
        run: bun run check:docket
      - name: The sign-up
        run: bun run check:signup
      - name: The pages
        run: bun run check:pages
      - name: Limits and headers
        run: bun run check:limits
      # Alchemy builds from source, so nothing built above is released.
      - name: Remove the local build
        run: rm -rf dist
      # ---- read only ----
      # `cutover`: no run has finished it. `move`: and the old Worker still holds the
      # domain, so this run moves it. `carries_on`: and an earlier run moved it.
      - name: Inspect civicobservatory.com and the earlier runs (read only)
        id: inspect
        run: bun scripts/production-domain.ts inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      # ---- first cutover only, while the old Worker holds the domain ----
      - name: First cutover - this runner can read the live site
        if: steps.inspect.outputs.move == 'true'
        run: bun scripts/check-production.ts https://civicobservatory.com reachable
      # Alchemy refuses a hostname another Worker holds.
      - name: First cutover - deploy civic-docket-production with the domain unmanaged
        if: steps.inspect.outputs.move == 'true'
        run: bun run deploy:production:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          PRODUCTION_DOMAIN: unmanaged
      - name: First cutover - wait for the operator's load (up to 60 minutes)
        id: load
        if: steps.inspect.outputs.move == 'true'
        run: bun scripts/await-docket.ts
        env:
          WORKERS_SUBDOMAIN: ${{ steps.inspect.outputs.workers_subdomain }}
      - name: First cutover - check civic-docket-production on workers.dev before it takes traffic
        if: steps.inspect.outputs.move == 'true'
        run: bun scripts/check-production.ts workers.dev cutover
        env:
          WORKERS_SUBDOMAIN: ${{ steps.inspect.outputs.workers_subdomain }}
          EXPECT_DOCKET: ${{ steps.load.outputs.docket }}
      # Later runs find this step, and the give-back, by name in GitHub's record.
      - name: First cutover - move civicobservatory.com to civic-docket-production
        id: move
        if: steps.inspect.outputs.move == 'true'
        run: bun scripts/production-domain.ts move
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
      # ---- every release, and a first cutover that did not finish ----
      - name: Deploy production (Alchemy, domain declared, workers.dev off)
        run: bun run deploy:production:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
      - name: Check https://civicobservatory.com serves this commit
        run: bun scripts/check-production.ts https://civicobservatory.com "$CHECK_MODE"
        env:
          CHECK_MODE: ${{ steps.inspect.outputs.move == 'true' && 'cutover' || 'release' }}
          EXPECT_DOCKET: ${{ steps.load.outputs.docket }}
      # A timeout cancels rather than fails the job; both end here. It gives back what
      # this run, or the run it carries on, has moved. It ends red while a domain write
      # of this run may still land, and then no run goes on for an hour.
      - name: First cutover failed - civicobservatory.com back to civic-observatory
        if: (failure() || cancelled()) && steps.inspect.outputs.cutover == 'true'
        run: bun scripts/production-domain.ts restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          MOVE_OUTCOME: ${{ steps.move.outcome }}
          MOVE_ASKED: ${{ steps.move.outputs.asked }}
          MOVE_UNANSWERED: ${{ steps.move.outputs.unanswered }}
          CARRIES_ON: ${{ steps.inspect.outputs.carries_on }}
