name: Native stack verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: civic-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and local D1 end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Generate local-only signing settings
        run: node scripts/local-env.mjs
      - name: Build and typecheck
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Real local Worker, D1, and R2 workflow
        run: pnpm smoke:local
      - name: Offline export migration into local D1 and R2
        run: pnpm smoke:migration

# Jesse, 2026-10-09: no unit tests, including gates and CI.
# Jesse, 2026-11-07: Alchemy, Effect, Better Auth and D1; no cutover on this errand.
# No credentials, remote migrations, infrastructure application, DNS, or deploy job.
